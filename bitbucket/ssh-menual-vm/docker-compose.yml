# 로컬/검증용 구성. DB 는 외부(dev RDS)를 .env 로 주입, Redis 는 컨테이너로 띄움.
# 실행: docker compose up --build
services:
  api:
    build: .
    ports:
      - "8093:8093"          # 컨테이너 SERVICE_PORT=8093 와 일치
    env_file:
      - .env
    environment:
      # 컴포즈 네트워크 안에서는 redis 서비스명으로 접속 (.env 의 REDIS_URL 을 덮어씀)
      REDIS_URL: redis://redis:6379
    volumes:
      - ./logs:/app/logs          # winston 로그를 호스트로 영속
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
