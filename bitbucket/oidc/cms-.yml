#  ==============  레포지토리 환경 변수  ==============
#   AWS_ROLE_ARN(워크스페이스 변수), AWS_DEFAULT_REGION                  # ECR 로그인
#   AWS_ECR_REPO, AWS_ECR_NAME                                          # ECR 라이브
#   AWS_ECR_REPO_DEV, AWS_ECR_NAME_DEV                                  # ECR 데브
#   K8S_REPO, K8S_API_TOKEN          GIT_EMAIL                          # K8S 라이브, 데브
# =================================================
#  EXP Jan 16, 2027 (K8S)
# =================================================
image: atlassian/default-image:2

pipelines:
  tags:
    '*.*.*-dev-*':
      - step:
          name: 🏗️ Build & Push Image to ECR (DEV)
          oidc: true
          size: 2x
          # 이미지를 지정하지 않고 최상단 atlassian/default-image:2 를 사용한다.
          # docker 서비스가 주입하는 CLI 에는 buildx 가 없어 BuildKit 이
          # 컨테이너로 뜨지 않음(Bitbucket 은 --privileged 차단).
          # 이 이미지에는 git 이 있어 repo clone 도 정상 동작.
          services:
            - docker
          script:
            # ECR 로그인 (호스트 의존성 없이 aws-cli 컨테이너로 실행)
            # 인증은 OIDC — 저장된 액세스 키가 없다. 토큰을 **환경변수로** 컨테이너에 넣고
            # 컨테이너 안에서 파일로 쓴다. Bitbucket 이 빌드 디렉토리 밖 -v 마운트를 막아
            # 호스트의 토큰 파일을 마운트할 수 없기 때문이다(--entrypoint·-e 는 허용).
            # ⚠️ 이 로그인은 아래 `docker pull :latest`(캐시 소스) 의 전제다. 순서를 바꾸면
            #    캐시 pull 이 인증 없이 실패하고 `|| true` 에 묻혀 매번 전체 빌드가 된다.
            - |
              docker run --rm \
                -e AWS_ROLE_ARN -e AWS_DEFAULT_REGION -e BITBUCKET_STEP_OIDC_TOKEN \
                --entrypoint sh amazon/aws-cli -c '
                  umask 077
                  printf %s "$BITBUCKET_STEP_OIDC_TOKEN" > /tmp/oidc-token
                  export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc-token
                  aws sts get-caller-identity >&2
                  aws ecr get-login-password --region "$AWS_DEFAULT_REGION"
                ' | docker login --username AWS --password-stdin $AWS_ECR_REPO_DEV
            # 데몬 내장 BuildKit 사용 (컨테이너 기동 없음 → privileged 불필요)
            # 캐시 마운트(--mount=type=cache)도 그대로 동작함
            - export DOCKER_BUILDKIT=1
            # 직전 빌드 이미지를 캐시 소스로 받아옴 (최초 빌드 시 없으면 무시)
            - docker pull $AWS_ECR_REPO_DEV/$AWS_ECR_NAME_DEV:latest || true
            # BUILDKIT_INLINE_CACHE=1 로 캐시 메타데이터를 이미지에 내장 →
            # 다음 빌드가 :latest 만 pull 해도 deps/prisma 스테이지까지 재사용 가능
            - |
              docker build \
                --build-arg BUILDKIT_INLINE_CACHE=1 \
                --cache-from $AWS_ECR_REPO_DEV/$AWS_ECR_NAME_DEV:latest \
                -t $AWS_ECR_REPO_DEV/$AWS_ECR_NAME_DEV:$BITBUCKET_TAG \
                -t $AWS_ECR_REPO_DEV/$AWS_ECR_NAME_DEV:latest .
            # 레거시 CLI 에는 --push 가 없어 별도 push (두 태그는 같은 이미지라 레이어 재전송 없음)
            - docker push $AWS_ECR_REPO_DEV/$AWS_ECR_NAME_DEV:$BITBUCKET_TAG
            - docker push $AWS_ECR_REPO_DEV/$AWS_ECR_NAME_DEV:latest
      # cms / cms-cron 을 한 스텝에서 처리 → 같은 repo 를 두 번 clone 하고
      # 서로 push 경쟁하며 rebase 재시도하던 낭비 제거
      - step:
          name: CMS + CMS-CRON Deploy Trigger k8s pipe (DEV)
          image: alpine/git:latest
          clone:
            enabled: false
          script:
            # yq 를 alpine 저장소에서 설치 (GitHub 릴리스 다운로드보다 빠르고 안정적)
            - apk add --no-cache yq
            - git config --global user.email "$GIT_EMAIL"
            - git config --global user.name "Bitbucket Pipeline"
            # 최신 커밋만 clone (전체 히스토리 불필요)
            - git clone --depth 1 https://x-token-auth:$K8S_API_TOKEN@bitbucket.org/$K8S_REPO.git k8s-dir
            - cd k8s-dir

            - yq e '.image.tag = env(BITBUCKET_TAG)' -i ./helm-charts/cms/cms/values-dev.yaml
            - yq e '.image.tag = env(BITBUCKET_TAG)' -i ./helm-charts/cms/cms-cron/values-dev.yaml

            - git add .
            - 'git commit -m "chore: update cms/cms-cron dev image tag to $BITBUCKET_TAG"'
            - |
              n=0
              until [ "$n" -ge 10 ]
              do
                git pull --rebase origin main && git push origin main && break
                n=$((n+1))
                echo "Push failed. Retrying in 3 seconds... (Attempt $n)"
                sleep 1
              done
    '*.*.*':
        - step:
            name: 🏗️ Build & Push Image to ECR (PROD)
